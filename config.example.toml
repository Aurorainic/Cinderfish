# Cinderfish configuration example.
# Copy to config.toml and adjust. Every key can be overridden by the
# environment variable CINDERFISH_<UPPER_SNAKE_KEY> (e.g. CINDERFISH_DATABASE_URL).

host = "127.0.0.1"
port = 3000

# Public domain users will see (used for WebFinger and ActivityPub ids).
domain = "example.com"

# PostgreSQL is the only mandatory dependency.
database_url = "postgres://cinderfish:cinderfish@localhost:5432/cinderfish"

# open | invite | admin
registration_mode = "admin"

# public | allowlist | none
federation_mode = "none"

# Built frontend directory (index.html + assets). Leave the default if you
# build web/ with `pnpm build`; a missing directory keeps the server
# API-only.
web_dir = "./web/dist"

# Outbound email: verification links, password resets. With no host set the
# server prints the message to the log instead of delivering it, so a fresh
# instance can be set up by copying the link out of the log.
[mail]
host = ""
port = 587
username = ""
password = ""
# Defaults to no-reply@<domain> when empty.
from = ""
# starttls (587) | tls (465, implicit TLS) | none (local relay only)
tls = "starttls"

# Optional Redis: PostgreSQL stays the source of truth. Redis pub/sub
# carries Streaming events and delivery wakeups between processes of one
# instance.
[redis]
enabled = false
url = "redis://127.0.0.1:6379/0"
prefix = "cinderfish"

[media]
# local | s3
backend = "local"
local_path = "./data/files"

[media.s3]
endpoint = ""
bucket = ""
region = ""
access_key = ""
secret_key = ""
use_ssl = true
# Base URL objects are served from; leave empty to use presigned GETs.
public_base_url = ""
# PEM file with a private CA for a self-hosted endpoint (MinIO behind an
# internal CA). Leave empty to trust the system roots only.
ca_cert = ""
