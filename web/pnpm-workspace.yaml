# pnpm 12 reads build-script approval here (the package.json "pnpm" field
# is no longer read; allowBuilds replaced onlyBuiltDependencies in v11).
# @parcel/watcher ships a postinstall it needs; without this stanza a clean
# `pnpm install --frozen-lockfile` (CI) fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  "@parcel/watcher": true
